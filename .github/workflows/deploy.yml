name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install SvelteKit dependencies
        run: npm ci

      - name: Build SvelteKit
        run: npm run build

      - name: Move SvelteKit build aside
        run: mv build svelte-build

      - uses: actions/checkout@v4
        with:
          ref: docusaurus-legacy
          path: docusaurus-src
          clean: false

      - name: Install Docusaurus dependencies
        working-directory: docusaurus-src
        run: yarn install --frozen-lockfile

      - name: Build Docusaurus
        working-directory: docusaurus-src
        run: yarn build

      - name: Combine builds
        run: |
          mv svelte-build combined-build
          mv docusaurus-src/build combined-build/v1
          mkdir -p combined-build/dev
          cat > combined-build/dev/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta http-equiv="refresh" content="0; url=/Anki-xiehanzi/" />
            <link rel="canonical" href="https://krmanik.github.io/Anki-xiehanzi/" />
            <title>Redirecting…</title>
            <script>location.replace("/Anki-xiehanzi/" + location.search + location.hash);</script>
          </head>
          <body>Redirecting to <a href="/Anki-xiehanzi/">krmanik.github.io/Anki-xiehanzi</a>…</body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./combined-build
