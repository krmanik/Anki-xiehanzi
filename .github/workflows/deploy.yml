name: Deploy to GitHub Pages

on:
  push:
    branches:
      - port-vite-svelte
      - main

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: port-vite-svelte

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install SvelteKit dependencies
        run: npm ci

      - name: Build SvelteKit
        run: npm run build

      - name: Move SvelteKit build aside
        run: mv build svelte-build

      - uses: actions/checkout@v4
        with:
          ref: main
          path: docusaurus-src
          clean: false

      - name: Install Docusaurus dependencies
        working-directory: docusaurus-src
        run: yarn install --frozen-lockfile

      - name: Build Docusaurus
        working-directory: docusaurus-src
        run: yarn build

      - name: Combine builds
        run: |
          mv docusaurus-src/build combined-build
          mv svelte-build combined-build/dev

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./combined-build
