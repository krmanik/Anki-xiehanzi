<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/img/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="Learn, read, write and practice Mandarin by drawing strokes in Anki"
		/>
		<script>
			// Before first paint, so a dark page never flashes white. Mirrors
			// src/lib/theme.ts: key `xhz.theme`, unset means light for now.
			try {
				var t = localStorage.getItem('xhz.theme');
				if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
					document.documentElement.dataset.theme = 'dark';
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
